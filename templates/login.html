{% extends "base.html" %}

{% block logincontent %}
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-mark large">N</div>
      <h1>Nairobi Urban Flood Risk Dashboard</h1>
      <p>Decision support for flood loss and hotspot screening</p>
    </div>

    <form method="post" action="{{ url_for('login') }}" class="login-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required placeholder="analyst@nimrod-risk.co.ke" autocomplete="email">

      <div class="password-row">
        <label for="password">Password</label>
        <a href="{{ url_for('forgot_password') }}" class="inline-link">Forgot password?</a>
      </div>
      <div class="password-input-wrap">
        <input id="password" name="password" type="password" required placeholder="Enter password" autocomplete="current-password">
        <button type="button" class="toggle-password" aria-label="Show or hide password">Show</button>
      </div>

      {% if form_error %}
      <div class="form-error" role="alert">{{ form_error }}</div>
      {% endif %}

      <button type="submit" class="primary-button">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
